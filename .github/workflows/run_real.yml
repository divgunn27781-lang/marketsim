name: Run on real market data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 2-6"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python3 build_db.py --no-synthetic
      - run: python3 fetch_real_data.py
      - run: python3 run_pipeline.py --include-real-events
      - run: python3 tools/build_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-outputs
          path: |
            outputs/
            global_markets.db
